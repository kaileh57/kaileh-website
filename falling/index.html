<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Falling Sand Simulation</title>
    <link rel="icon" type="image/png" id="favicon">
    
    <!-- Google Fonts - Same as portfolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">Advanced Falling Sand</div>
                <div class="simulation-controls">
                    <button id="clear-button" class="control-btn">Reset</button>
                </div>
            </div>
            <div class="header-right">
                <div class="performance-display">
                    <span id="fps-text">60 FPS</span>
                </div>
            </div>
        </div>

        <!-- Material Palette -->
        <div class="material-palette">
            <div class="palette-header">
                <div class="palette-title">Materials</div>
            </div>
            <div id="palette" class="material-grid">
                <!-- Materials will be populated by JavaScript -->
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
            <canvas id="simulationCanvas"></canvas>
        </div>

        <!-- Info Panel -->
        <div class="info-panel">
            <div class="info-section">
                <div class="info-title">Current Tool</div>
                <div id="material-text" style="font-size: 0.875rem; color: var(--text-secondary);">Brush: Sand (Size: 3)</div>
            </div>
            
            <div class="info-section">
                <div class="info-title">Position</div>
                <div id="coords-text" style="font-size: 0.875rem; color: var(--text-secondary);">Coords: (0, 0)</div>
            </div>

            <div class="info-section">
                <div class="info-title">Brush Controls</div>
                <div class="brush-controls">
                    <div class="control-group">
                        <label class="control-label">Brush Size</label>
                        <input type="range" id="brushSize" class="size-slider" min="1" max="20" value="3">
                    </div>
                    <div class="brush-preview">
                        <div id="brushPreview" class="brush-circle"></div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="info-title">Visualization</div>
                <div class="visualization-modes">
                    <button class="viz-mode active" data-mode="normal">Normal</button>
                    <button class="viz-mode" data-mode="temperature">Heat</button>
                    <button class="viz-mode" data-mode="pressure">Pressure</button>
                    <button class="viz-mode" data-mode="velocity">Velocity</button>
                </div>
            </div>

            <div class="info-section">
                <div class="info-title">Statistics</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="statFPS">60</div>
                        <div class="stat-label">FPS</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statParticles">0</div>
                        <div class="stat-label">Particles</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statTemp">20°</div>
                        <div class="stat-label">Avg Temp</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="statPressure">1.0</div>
                        <div class="stat-label">Pressure</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden canvas for favicon -->
    <canvas id="faviconCanvas" width="16" height="16" style="display: none;"></canvas>

    <script src="script.js"></script>
</body>
</html>
